[project]
name = "polaris"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arhan Jain", email = "arhan.j04@gmail.com" }
]
requires-python = ">=3.11, <3.12"
dependencies = [
    "isaaclab[all,isaacsim]==2.3.0",
    "mediapy>=1.2.4",
    "opencv-python>=4.11.0.86",
    "plyfile>=1.1.3",
    "tyro>=0.9.17",
    "diff-surfel-rasterization",
    "simple-knn",
    "openpi-client",
    "nvidia-curobo",
    "open3d",
    "usd-core",
    "diff-gaussian-rasterization",
    "gsplat",
    "robosuite @ https://github.com/ARISE-Initiative/robosuite/archive/b9d8d3de5e3dfd1724f4a0e6555246c460407daa.tar.gz",
    # 3D diffusion policy / SMITH deps
    "diffusers>=0.30.0",
    "huggingface-hub>=0.25.0",
    "zarr==3.1.5",
    "dill==0.4.1",
    "einops==0.8.1",
    "hydra-core==1.3.2",
    "numcodecs==0.16.5",
    "omegaconf==2.3.0",
    "termcolor==3.3.0",
    "wandb==0.25.1",
    "av",
    "msgpack_numpy",
    "msgpack",
    "pytorch3d @ git+https://github.com/facebookresearch/pytorch3d.git@stable",
    #"torch>=2.9.0", # Change here for different CUDA version
    #"torchvision>=0.24.0", # Change here for different CUDA version
    "pyzmq>=27.1.0",
]

[project.scripts]
polaris = "polaris.cli:main"

[tool.uv]
override-dependencies = [
    "pywin32==306; sys_platform == 'win32'",
    "evdev-binary; sys_platform == 'linux'",
    "torch>=2.9.0", # Change here for different CUDA version
    "torchvision>=0.24.0", # Change here for different CUDA version
    "robosuite @ https://github.com/ARISE-Initiative/robosuite/archive/b9d8d3de5e3dfd1724f4a0e6555246c460407daa.tar.gz",
    "diffusers>=0.30.0",
    "huggingface-hub>=0.25.0",
    "zarr==3.1.5",
    "dill==0.4.1",
    "einops==0.8.1",
    "hydra-core==1.3.2",
    "numcodecs==0.16.5",
    "omegaconf==2.3.0",
    "termcolor==3.3.0",
    "wandb==0.25.1",
]

[tool.uv.extra-build-dependencies]
flatdict = ["setuptools<82"]
polaris = ["hatchling"]
diff-gaussian-rasterization = ["torch"]
pytorch3d = ["torch", "setuptools"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.14.9",
]

[tool.uv.sources]
isaacsim = { index = "nvidia" }
diff-surfel-rasterization = { path = "src/diff-surfel-rasterization", editable = true }
diff-gaussian-rasterization = { path = "src/diff-gaussian-rasterization", editable = true }
simple-knn = { path = "src/simple-knn", editable = true }
openpi-client = { path = "third_party/openpi/packages/openpi-client" }
torch = { index = "torch" }
torchvision = { index = "torch" }
nvidia-curobo = { path = "src/curobo", editable = true }

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "torch"
url = "https://download.pytorch.org/whl/cu126" # Change here for different CUDA version
explicit = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.basedpyright]
extraPaths = [
    "./.venv/lib/python3.11/site-packages/isaaclab/source/isaaclab/",
    "./.venv/lib/python3.11/site-packages/isaaclab/source/isaaclab_assets/",
    "./.venv/lib/python3.11/site-packages/isaaclab/source/isaaclab_tasks/",
]
typeCheckingMode = "standard"
