  #   rel_quat: [0.0, 1.0, 0.0, 0.0]
  #   grasp: 1
  #   subgoal: True
  - object: red_cup/blue_plate
    offset: [0.0, 0.0, 0.2]       # lift
    rel_quat: [0.0, 1.0, 0.0, 0.0]
    grasp: 1
    subgoal: False
  - object: blue_plate
    offset: [0.0, -0.08, 0.02]       # preplace
    rel_quat: [0.0, 1.0, 0.0, 0.0]
    grasp: 1
    subgoal: True
